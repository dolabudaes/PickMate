services:
  api:
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install -r apps/api/requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8011 --app-dir apps/api"
    ports:
      - "8011:8011"
    volumes:
      - .:/app
    environment:
      APP_ENV: development
      SQLITE_PATH: /app/apps/api/data/pickmate-app.db
      EXPO_PUBLIC_API_URL: http://127.0.0.1:8011
      LLM_MODE: ${LLM_MODE:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}

  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["extras"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pickmate
      POSTGRES_PASSWORD: pickmate
      POSTGRES_DB: pickmate
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ["extras"]
    ports:
      - "6379:6379"

volumes:
  pgdata:
